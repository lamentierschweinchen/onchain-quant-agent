name: Poll EGLD market

# Appends one reading an hour to dashboard/public/market-history.json, and
# refreshes the long-range price snapshot in dashboard/public/price-history.json.
#
# The tracker's live tiles refresh themselves in the browser, but the HISTORY
# series only grows when something records a reading. This is that something.
#
# The page reads the file straight from raw.githubusercontent.com, so a commit
# here is enough — no redeploy is needed for new points to appear.
#
# OBSERVED CADENCE, 2-3 Sep 2026: this cron is set to hourly and GitHub actually
# delivered it roughly every 4-5 hours (gaps of 4.1, 5.5, 4.8 and 4.1 hours over
# the first night). GitHub's scheduled runs are best-effort and deprioritised
# under load, and there is no way to buy priority for a public repo. So treat
# "hourly" as a ceiling, not a promise. The dashboard already draws unsampled
# stretches as dashed rather than interpolating them, which is why this is a
# resolution limit rather than a correctness problem.
#
# Also: GitHub disables cron on repos with no pushes for 60 days.

on:
  schedule:
    - cron: '7 * * * *'   # hourly, off the hour to dodge the :00 stampede
  workflow_dispatch:       # so it can be run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: poll-market
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Take a reading
        run: python3 scripts/poll_market.py

      # The "bigger picture" panel's fallback, for when CoinGecko rate-limits
      # the live proxy. A year of daily closes barely moves, so a failure here
      # is not worth failing the run over — the previous snapshot stays valid.
      - name: Refresh the long-range price snapshot
        continue-on-error: true
        run: python3 scripts/poll_price_history.py

      - name: Commit if anything changed
        run: |
          FILES="dashboard/public/market-history.json dashboard/public/price-history.json dashboard/public/derivatives-snapshot.json"
          if git diff --quiet -- $FILES; then
            echo "No change — upstream had nothing new."
            exit 0
          fi
          git config user.name  "egld-pump-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Market reading $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another run may have landed while this one was fetching.
          git pull --rebase --autostash origin main
          git push
