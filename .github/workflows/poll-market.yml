name: Poll EGLD market

# Appends one reading an hour to dashboard/public/market-history.json.
#
# The tracker's live tiles refresh themselves in the browser, but the HISTORY
# series only grows when something records a reading. This is that something.
#
# The page reads the file straight from raw.githubusercontent.com, so a commit
# here is enough — no redeploy is needed for new points to appear.
#
# Caveats worth knowing: GitHub's scheduled runs are best-effort and can be
# delayed by tens of minutes under load, and GitHub disables cron on repos with
# no pushes for 60 days. Neither matters much for an hourly series.

on:
  schedule:
    - cron: '7 * * * *'   # hourly, off the hour to dodge the :00 stampede
  workflow_dispatch:       # so it can be run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: poll-market
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Take a reading
        run: python3 scripts/poll_market.py

      - name: Commit if the file changed
        run: |
          if git diff --quiet -- dashboard/public/market-history.json; then
            echo "No change — upstream had nothing new."
            exit 0
          fi
          git config user.name  "egld-pump-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/market-history.json
          git commit -m "Market reading $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another run may have landed while this one was fetching.
          git pull --rebase --autostash origin main
          git push
